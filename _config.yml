# GitHub Pages serves the generated static HTML at the repository root.
# No theme, Ruby plugins, or Liquid templates are needed by the new site.
title: Ashesh Rambachan
url: https://asheshrambachan.github.io
baseurl: ""
encoding: utf-8
exclude:
  - content
  - scripts
  - README.md
  - package.json
  - Gemfile
  - Gemfile.lock
  - CHANGELOG.md
  - CONTRIBUTING.md
  - LICENSE
  - markdown_generator
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - assets/css/main.scss
  - assets/css/main.css
  - assets/js
  - assets/fonts
  - assets/vendor
  - node_modules
  - .site-preview
  - .DS_Store
